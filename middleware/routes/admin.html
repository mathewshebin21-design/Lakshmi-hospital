<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lakshmi Hospital — Admin: Submissions</title>
<style>
  body{font-family:Inter,Arial,sans-serif;background:#f9f9ff;color:#151c27;margin:0;padding:40px 24px;}
  .wrap{max-width:960px;margin:0 auto;}
  h1{color:#031635;}
  .row{display:flex;gap:12px;margin-bottom:24px;}
  input{flex:1;padding:10px 14px;border:1px solid #c5c6cf;border-radius:8px;}
  button{background:#031635;color:#fff;border:0;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:600;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:40px;}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid #eee;font-size:14px;}
  th{background:#031635;color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.05em;}
  tr:last-child td{border-bottom:none;}
  .empty{color:#75777f;padding:20px;text-align:center;}
  h2{color:#031635;margin-top:40px;}
  .err{color:#ba1a1a;margin-bottom:16px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Lakshmi Hospital — Submissions</h1>
  <p style="color:#44474e">Enter the admin key (from your server's <code>.env</code> file) to view appointment and contact form submissions.</p>
  <div class="row">
    <input id="apiBase" placeholder="API base URL, e.g. https://api.lakshmihospital.com" value="http://localhost:4000" />
    <input id="adminKey" type="password" placeholder="Admin key" />
    <button onclick="load()">Load</button>
  </div>
  <p id="error" class="err"></p>

  <h2>Appointment Requests</h2>
  <table id="apptTable"><thead><tr><th>Date</th><th>Name</th><th>Phone</th><th>Department</th><th>Branch</th><th>Message</th></tr></thead><tbody></tbody></table>

  <h2>Contact Messages</h2>
  <table id="contactTable"><thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Phone</th><th>Message</th></tr></thead><tbody></tbody></table>
</div>

<script>
async function load(){
  const base = document.getElementById('apiBase').value.replace(/\/$/,'');
  const key = document.getElementById('adminKey').value;
  const errEl = document.getElementById('error');
  errEl.textContent = '';
  try{
    const [apptRes, contactRes] = await Promise.all([
      fetch(base + '/api/appointments', { headers: { 'x-admin-key': key } }),
      fetch(base + '/api/contact', { headers: { 'x-admin-key': key } }),
    ]);
    if(!apptRes.ok || !contactRes.ok) throw new Error('Unauthorized or server error — check the API URL and admin key.');
    const appts = (await apptRes.json()).appointments;
    const contacts = (await contactRes.json()).contacts;

    const apptBody = document.querySelector('#apptTable tbody');
    apptBody.innerHTML = appts.length ? appts.map(a => `<tr><td>${new Date(a.createdAt).toLocaleString()}</td><td>${a.fullName}</td><td>${a.phone}</td><td>${a.department}</td><td>${a.branch}</td><td>${a.message||'—'}</td></tr>`).join('') : '';
    if(!appts.length) apptBody.innerHTML = '<tr><td colspan="6" class="empty">No appointment requests yet.</td></tr>';

    const contactBody = document.querySelector('#contactTable tbody');
    contactBody.innerHTML = contacts.length ? contacts.map(c => `<tr><td>${new Date(c.createdAt).toLocaleString()}</td><td>${c.name}</td><td>${c.email}</td><td>${c.phone||'—'}</td><td>${c.message}</td></tr>`).join('') : '';
    if(!contacts.length) contactBody.innerHTML = '<tr><td colspan="5" class="empty">No contact messages yet.</td></tr>';
  }catch(e){
    errEl.textContent = e.message;
  }
}
</script>
</body>
</html>
